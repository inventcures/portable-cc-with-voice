# SSH Hardening Configuration for Portable Claude Code VM
#
# This file provides secure SSH settings.
# Place contents in /etc/ssh/sshd_config.d/portable-cc.conf
# or append to /etc/ssh/sshd_config
#
# After updating, restart sshd: sudo systemctl restart sshd

# ============================================
# SECURITY SETTINGS
# ============================================

# Disable password authentication (key-based auth only)
PasswordAuthentication no
ChallengeResponseAuthentication no
UsePAM no

# Disable root login
PermitRootLogin no

# Disable X11 forwarding (not needed for terminal)
X11Forwarding no

# Limit authentication attempts
MaxAuthTries 3
MaxStartups 3:30:5

# Disable unused authentication methods
GSSAPIAuthentication no
KerberosAuthentication no

# Use SSH protocol 2 only
Protocol 2

# Logging
SyslogFacility AUTH
LogLevel VERBOSE

# ============================================
# MOBILE-FRIENDLY SETTINGS
# ============================================

# Keep alive packets for network transitions
ClientAliveInterval 60
ClientAliveCountMax 3

# TCP keep-alive
TCPKeepAlive yes

# Allow longer timeouts for slow connections
LoginGraceTime 60

# ============================================
# PERFORMANCE
# ============================================

# Use faster encryption
Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com

# Compression (helps with terminal bandwidth)
Compression yes

# ============================================
# ACCESS CONTROL
# ============================================

# Only allow specific users (uncomment and modify)
# AllowUsers ubuntu

# Only allow specific groups (optional)
# AllowGroups ssh-users

# ============================================
# MOSH-SPECIFIC (if using mosh)
# ============================================

# mosh uses UDP in a range, ensure firewall allows it
# Add to ufw: sudo ufw allow 60000:61000/udp

# ============================================
# NOTES
# ============================================

# This config assumes:
# - SSH keys are properly set up
# - Tailscale provides network security
# - Fail2ban is handling brute-force attempts
# - Only trusted devices have Tailscale access

# To apply changes:
# sudo cp sshd-config.conf /etc/ssh/sshd_config.d/portable-cc.conf
# sudo systemctl restart sshd
