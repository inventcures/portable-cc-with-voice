# Portable Claude Code - tmux configuration
#
# This configuration is optimized for mobile development with:
# - Screen-compatible prefix key (C-a)
# - Mobile-friendly keybindings
# - Compact status bar
# - Better pane navigation

# ============================================
# Prefix Key
# ============================================

# Remap prefix from C-b to C-a (screen-compatible)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ============================================
# General Settings
# ============================================

# Increase scrollback buffer for reviewing output
set -g history-limit 10000

# Enable mouse support (essential for iOS)
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster command sequences
set -sg escape-time 10

# Increase repeat timeout for iOS keyboard delays
set -sg repeat-time 600

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multiple monitors
setw -g aggressive-resize on

# ============================================
# Status Bar - Compact for Mobile
# ============================================

# Refresh status bar more frequently
set -g status-interval 5

# Status bar position
set -g status-position bottom

# Status bar colors
set -g status-style 'bg=black fg=white'

# Status left - session name
set -g status-left '[#S] '
set -g status-left-length 20

# Status right - time
set -g status-right '%H:%M '
set -g status-right-length 10

# Status bar appearance
setw -g window-status-current-style 'bg=white fg=black bold'
setw -g window-status-style 'bg=black fg=white'

# ============================================
# Keybindings
# ============================================

# Easy reload of config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Better pane splitting
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation (iOS keyboard friendly - hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation (arrow keys also work)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Pane resizing (mobile-friendly)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Window navigation
bind n next-window
bind p previous-window
bind -r C-n next-window
bind -r C-p previous-window

# Direct window access
bind 0 select-window -t :10
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# Rename window
bind , command-prompt -p "Window name:" "rename-window '%%'"

# ============================================
# Copy Mode - Vi Style
# ============================================

setw -g mode-keys vi

# Vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Rectangle toggle (useful for table data)
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ============================================
# Session Management
# ============================================

# Detach from session
bind d detach
bind D choose-client

# Switch to last session
bind Tab switch-client -l

# List sessions
bind s choose-session

# List windows
bind w choose-window

# ============================================
# Layouts
# ============================================

# Cycle through layouts
bind Space next-layout

#预设布局： Even-horizontal、Even-vertical、Main-horizontal、Main-vertical、Tiled
bind E select-layout even-horizontal
bind e select-layout even-vertical
bind M select-layout main-horizontal
bind m select-layout main-vertical
bind T select-layout tiled

# ============================================
# Colors
# ============================================

# Enable 256 color support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Pane borders
set -g pane-border-style 'fg=color0 bg=color0'
set -g pane-active-border-style 'fg=color4 bg=color0'

# Command line colors
set -g message-command-style 'fg=color233 bg=color4'
set -g message-style 'fg=color233 bg=color4'

# ============================================
# Other
# ============================================

# Auto-hide status bar for single window
# Uncomment if you prefer more screen space
# set -g status off
# set -g status on

# Set default shell
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
